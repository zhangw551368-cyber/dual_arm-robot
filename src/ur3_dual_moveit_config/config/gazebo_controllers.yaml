# Publish joint_states from Gazebo.
joint_state_controller:
  type: joint_state_controller/JointStateController
  publish_rate: 50

gazebo_ros_control:
  pid_gains:
    left_arm_shoulder_pan_joint: {p: 4000.0, i: 0.0, d: 100.0}
    left_arm_shoulder_lift_joint: {p: 6000.0, i: 0.0, d: 120.0}
    left_arm_elbow_joint: {p: 2500.0, i: 0.0, d: 60.0}
    left_arm_wrist_1_joint: {p: 800.0, i: 0.0, d: 20.0}
    left_arm_wrist_2_joint: {p: 800.0, i: 0.0, d: 20.0}
    left_arm_wrist_3_joint: {p: 200.0, i: 0.0, d: 5.0}
    right_arm_shoulder_pan_joint: {p: 4000.0, i: 0.0, d: 100.0}
    right_arm_shoulder_lift_joint: {p: 6000.0, i: 0.0, d: 120.0}
    right_arm_elbow_joint: {p: 2500.0, i: 0.0, d: 60.0}
    right_arm_wrist_1_joint: {p: 800.0, i: 0.0, d: 20.0}
    right_arm_wrist_2_joint: {p: 800.0, i: 0.0, d: 20.0}
    right_arm_wrist_3_joint: {p: 200.0, i: 0.0, d: 5.0}

left_arm_joint_traj_controller:
  type: position_controllers/JointTrajectoryController
  joints:
    - left_arm_shoulder_pan_joint
    - left_arm_shoulder_lift_joint
    - left_arm_elbow_joint
    - left_arm_wrist_1_joint
    - left_arm_wrist_2_joint
    - left_arm_wrist_3_joint
  constraints:
    goal_time: 3.0
    stopped_velocity_tolerance: 2.0
    left_arm_shoulder_pan_joint: {trajectory: 0.5, goal: 0.3}
    left_arm_shoulder_lift_joint: {trajectory: 0.5, goal: 0.3}
    left_arm_elbow_joint: {trajectory: 0.5, goal: 0.3}
    left_arm_wrist_1_joint: {trajectory: 0.5, goal: 0.3}
    left_arm_wrist_2_joint: {trajectory: 0.5, goal: 0.3}
    left_arm_wrist_3_joint: {trajectory: 0.5, goal: 0.3}
  stop_trajectory_duration: 0.5

right_arm_joint_traj_controller:
  type: position_controllers/JointTrajectoryController
  joints:
    - right_arm_shoulder_pan_joint
    - right_arm_shoulder_lift_joint
    - right_arm_elbow_joint
    - right_arm_wrist_1_joint
    - right_arm_wrist_2_joint
    - right_arm_wrist_3_joint
  constraints:
    goal_time: 3.0
    stopped_velocity_tolerance: 2.0
    right_arm_shoulder_pan_joint: {trajectory: 0.5, goal: 0.3}
    right_arm_shoulder_lift_joint: {trajectory: 0.5, goal: 0.3}
    right_arm_elbow_joint: {trajectory: 0.5, goal: 0.3}
    right_arm_wrist_1_joint: {trajectory: 0.5, goal: 0.3}
    right_arm_wrist_2_joint: {trajectory: 0.5, goal: 0.3}
    right_arm_wrist_3_joint: {trajectory: 0.5, goal: 0.3}
  stop_trajectory_duration: 0.5
